name: Format & Lint Check

on: [push, pull_request]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy cmake ninja-build

      - name: Check Formatting (clang-format)
        run: |
          find . -path "./build" -prune -o \( -name "*.cpp" -o -name "*.hpp" -o -name "*.c" -o -name "*.h" \) -print | xargs -r clang-format --dry-run --Werror --style=file

      - name: Configure CMake (Export Compile Commands)
        run: |
          cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -G Ninja

      - name: Run Linter (clang-tidy)
        run: |
          find src/ include/ -type f \( -name "*.cpp" -o -name "*.c" \) 2>/dev/null | xargs -r clang-tidy -p build --warnings-as-errors='*'
