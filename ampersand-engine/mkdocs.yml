site_name: Ampersand Engine
site_url: https://boz0o0.github.io/Ampersand-Engine/
repo_url: https://github.com/Boz0o0/Ampersand-Engine
repo_name: Boz0o0/Ampersand-Engine
docs_dir: docs/mkdocs

theme:
  name: material
  logo: assets/ampersand-logo-light.svg
  favicon: assets/ampersand-logo.svg
  palette:
    - scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }
    - scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
  features: [navigation.sections, navigation.indexes, navigation.instant, content.code.copy, search.highlight]

markdown_extensions:
  - admonition
  - attr_list
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Adding a feature: adding-a-feature.md #ptet rename add a component et pr l'ecs jsp
  - Architecture:
      - architecture/index.md
      - ECS: architecture/ecs.md
      - Physics: architecture/physics.md
      - Modules: architecture/modules.md
      - Render: architecture/rendering.md
      - Audio: architecture/audio.md
      - Networking: architecture/networking.md
      - Input: architecture/input.md
  - Design decisions: decisions.md
  - R-Type:
      - Documentation ↗: https://boz0o0.github.io/R-Type/
      - Source code ↗: https://github.com/Boz0o0/R-Type
