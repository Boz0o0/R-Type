name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install lint tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy cmake ninja-build

      - name: Install lint tools (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm --yes --no-progress

      - name: Initialize MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Check Formatting (Linux)
        if: runner.os == 'Linux'
        run: |
          find src/ tests/ -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.c" -o -name "*.h" \) -print0 |
          xargs -0 -r clang-format --dry-run --Werror --style=file

      - name: Check Formatting (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem src, tests -Recurse -File | Where-Object { $_.Extension -in ".cpp", ".hpp", ".c", ".h" }
          foreach ($file in $files) {
            clang-format --dry-run --Werror --style=file $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy (Linux)
        if: runner.os == 'Linux'
        run: |
          find src/ -type f \( -name "*.cpp" -o -name "*.c" \) -print0 |
          xargs -0 -r clang-tidy -p build -warnings-as-errors='*'

      - name: Run clang-tidy (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem src -Recurse -File | Where-Object { $_.Extension -in ".cpp", ".c" }
          foreach ($file in $files) {
            clang-tidy -p build -warnings-as-errors="*" $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-linux-${{ hashFiles('**/CMakeLists.txt', 'cmake/CPM.cmake') }}
          restore-keys: cpm-linux-
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-windows-${{ hashFiles('**/CMakeLists.txt', 'cmake/CPM.cmake') }}
          restore-keys: cpm-windows-
      - name: Configure CMake
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Debug --parallel

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-linux-${{ hashFiles('**/CMakeLists.txt', 'cmake/CPM.cmake') }}
          restore-keys: cpm-linux-
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-windows-${{ hashFiles('**/CMakeLists.txt', 'cmake/CPM.cmake') }}
          restore-keys: cpm-windows-
      - name: Configure CMake
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Run tests
        run: ctest --test-dir build -C Debug --output-on-failure

  mirror:
    name: Mirror push to main
    needs: [test-linux, test-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MIRROR_SSH_PRIVATE_KEY }}
      - name: Push mirror
        env:
          MIRROR_REPO_URL: ${{ secrets.MIRROR_REPO_URL }}
        run: |
          git remote add mirror "$MIRROR_REPO_URL" 2>/dev/null || git remote set-url mirror "$MIRROR_REPO_URL"
          git push mirror --mirror
