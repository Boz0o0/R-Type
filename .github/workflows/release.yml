name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          cmake_version=$(sed -n '/^project(/,/)/s/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$version" != "$cmake_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project(VERSION $cmake_version) in CMakeLists.txt"
            exit 1
          fi

      - name: Create the release
        uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
